<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" fill="#fff"/><text x="46" y="52" fill="#111" font-size="26" font-family="Arial" font-weight="bold">Two-factor Poisson LC: numerical implementation check</text><text x="46" y="87" font-size="19" font-family="Arial" fill="#a22">SYNTHETIC POISSON DATA — NOT HUNGARIAN GBD RESULTS</text><text x="46" y="143" font-size="20" font-family="Arial">Training Poisson deviance (smaller is better)</text><line x1="304" y1="184" x2="304" y2="385" stroke="#777"/><text x="47" y="225" font-size="20" font-family="Arial">1 factor</text><rect x="305" y="197" width="631" height="45" rx="4" fill="#8c9ba9"/><text x="946" y="229" font-size="21" font-family="Arial" text-anchor="start">3545.80</text><text x="47" y="339" font-size="20" font-family="Arial">2 factors</text><rect x="305" y="306" width="27" height="45" rx="4" fill="#486f90"/><text x="344" y="337" font-size="21" font-family="Arial">152.45</text><line x1="46" x2="1035" y1="437" y2="437" stroke="#ddd"/><text x="46" y="489" font-size="21" font-family="Arial">Max analytic vs finite-difference gradient error: 1.21 × 10⁻¹²</text><text x="46" y="530" font-size="21" font-family="Arial">Canonical SVD reconstruction error: 8.88 × 10⁻¹⁶</text><text x="46" y="576" font-size="18" font-family="Arial" fill="#666">6 age groups × 36 years; independent SciPy test; no GBD data read.</text><text x="46" y="610" font-size="17" font-family="Arial" fill="#666">Do not use these numbers as evidence of empirical or forecast performance.</text></svg>